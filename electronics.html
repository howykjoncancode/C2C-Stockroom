<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Electronics Tracker — C2C Robotics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #F5F4F1; --panel: #FFFFFF; --ink: #1E2320; --border: #DCDAD3; --border-soft: #EEEDE7;
    --muted: #6B6F68; --accent: #2F5D74; --accent-bg: #EAF1F0;
    --warn: #C97A2B; --warn-bg: #FBEEDF; --danger: #A93226; --danger-bg: #F6E4E2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); }
  .app { display: flex; height: 100vh; }

  .sidebar { width: 220px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .brand { padding: 20px 18px 14px; }
  .brand-row { display: flex; align-items: center; gap: 8px; }
  .brand-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: 0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 0.03em; }
  .nav-list { padding: 8px 10px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 5px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
  .nav-item:hover { background: #F7F6F3; }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .footer-note { padding: 10px 16px 16px; font-size: 11px; color: #9A988E; border-top: 1px solid var(--border-soft); }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap svg { position: absolute; left: 10px; }
  .search-input { width: 240px; padding: 7px 10px 7px 32px; border: 1px solid var(--border); border-radius: 5px; font-size: 13.5px; outline: none; background: #FBFAF8; }
  .unit-total { font-size: 12.5px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

  .btn-primary { display: flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; border: none; border-radius: 5px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .btn-primary:hover { background: #26495B; }
  .btn-secondary { background: #F2F1EC; color: var(--ink); border: 1px solid var(--border); border-radius: 5px; padding: 9px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; }

  .table-wrap { flex: 1; overflow-y: auto; padding: 0 22px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; padding: 12px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  .mono-cell { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted); }
  .notes-cell { max-width: 220px; font-size: 12.5px; color: var(--muted); }
  .row-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 2px; color: var(--muted); }
  .icon-btn.danger { color: var(--danger); }
  .row-actions svg { display: block; }

  .badge { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
  .badge.ok { background: var(--accent-bg); color: var(--accent); }
  .badge.overdue { background: var(--danger-bg); color: var(--danger); }
  .badge.never { background: var(--warn-bg); color: var(--warn); }

  .empty-state { text-align: center; padding: 60px 10px; color: #9A988E; }
  .empty-state button { margin-top: 12px; background: var(--accent); color: #fff; border: none; border-radius: 5px; padding: 9px 16px; font-size: 13.5px; font-weight: 600; cursor: pointer; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(30,35,32,0.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 8px; width: 420px; padding: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.18); max-height: 88vh; overflow-y: auto; }
  .modal.wide { width: 560px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--muted); }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 13.5px; font-family: 'Inter', sans-serif; box-sizing: border-box; background: #fff; }
  .field input.mono { font-family: 'IBM Plex Mono', monospace; }
  .field textarea { resize: vertical; min-height: 56px; }
  .field-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .field-row .field { flex: 1; margin-bottom: 0; }
  .modal-save { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 5px; padding: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .modal-save.danger-save { background: var(--danger); }

  .history-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 16px; }
  .history-table th { text-align: left; padding: 6px 8px; font-size: 10.5px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border-soft); }
  .history-table td { padding: 6px 8px; border-bottom: 1px solid var(--border-soft); font-family: 'IBM Plex Mono', monospace; }
  .history-empty { text-align: center; color: #9A988E; padding: 20px; font-size: 12.5px; }

  .chart-controls { display: flex; gap: 10px; margin-bottom: 14px; }
  .chart-controls .field { flex: 1; margin-bottom: 0; }
  .chart-canvas-wrap { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 14px; }

  .report-controls { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
  .report-controls .field { flex: 1; margin-bottom: 0; }
  .report-table-wrap { max-height: 380px; overflow-y: auto; border: 1px solid var(--border-soft); border-radius: 6px; }
  .report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .report-table th { position: sticky; top: 0; background: #FAFAF8; text-align: left; padding: 8px 10px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--border-soft); }
  .report-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); }
  .report-row-flag { background: var(--danger-bg); }
  .report-row-flag td { color: var(--danger); font-weight: 600; }

  .auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .auth-box { width: 300px; text-align: center; }
  .auth-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; }
  .auth-sub { font-size: 12px; color: var(--muted); margin-bottom: 22px; letter-spacing: 0.03em; }
  .auth-box input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px; font-size: 14px; font-family: 'Inter', sans-serif; box-sizing: border-box; margin-bottom: 10px; }
  .auth-box button { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 5px; padding: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .auth-toggle { font-size: 12.5px; color: var(--muted); margin-top: 16px; }
  .auth-toggle span { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .auth-error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
  .user-row { padding: 10px 16px 14px; border-top: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .logout-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="auth-screen" id="auth-screen" style="display:none;">
  <div class="auth-box">
    <div class="auth-title">ELECTRONICS</div>
    <div class="auth-sub">C2C ROBOTICS · TRACKER</div>
    <input type="email" id="auth-email" placeholder="Email" autocomplete="username" />
    <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" />
    <button id="auth-submit">Sign In</button>
    <div class="auth-toggle" id="auth-toggle">Don't have an account? <span id="auth-toggle-link">Create one</span></div>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="loading-screen" style="position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px;">
  Loading…
</div>

<div class="app" id="app" style="display:none;"></div>

<script>
(function () {
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDyjUwJsX5E5wXTrm2xjZ1slXXwobJIM50",
    authDomain: "c2c-stockroom.firebaseapp.com",
    projectId: "c2c-stockroom",
    storageBucket: "c2c-stockroom.firebasestorage.app",
    messagingSenderId: "953266206640",
    appId: "1:953266206640:web:f18d064196320b8efe4875",
  };

  const SHARED_DOC_PATH = { collection: "stockroom", doc: "electronics-inventory" };

  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let unsubscribeSnapshot = null;
  const STORAGE_KEY = "electronics-tracker-data-v1";
  const OVERDUE_DAYS = 30;

  const svg = {
    chip: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>`,
    search: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A988E" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
    plus: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5v14"/></svg>`,
    x: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
    pencil: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>`,
    trash: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>`,
    gauge: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20a8 8 0 1 0-8-8"/><path d="M12 12 16 8"/><circle cx="12" cy="12" r="1"/></svg>`,
    chart: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 3 5-8"/></svg>`,
    chevron: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>`,
    copy: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  };

  let state = {
    items: [],
    search: "",
    view: "items", // "items" | "report"
  };

  function docRef() {
    return db.collection(SHARED_DOC_PATH.collection).doc(SHARED_DOC_PATH.doc);
  }

  function startSync() {
    document.getElementById("loading-screen").style.display = "flex";
    unsubscribeSnapshot = docRef().onSnapshot(
      (snap) => {
        if (snap.exists) {
          state.items = snap.data().items || [];
        } else {
          docRef().set({ items: [] });
        }
        document.getElementById("loading-screen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        render();
      },
      (err) => {
        console.error("Sync error:", err);
        document.getElementById("loading-screen").textContent = "Couldn't connect to the shared database. Check your internet connection.";
      }
    );
  }

  function saveState() {
    docRef().set({ items: state.items }).then(() => {
      const el = document.getElementById("save-status");
      if (el) { el.textContent = "Synced."; el.style.color = "#9A988E"; }
    }).catch((err) => {
      console.error("Save error:", err);
      const el = document.getElementById("save-status");
      if (el) { el.textContent = "Couldn't sync last change."; el.style.color = "#A93226"; }
    });
  }

  function uid(prefix) { return prefix + Date.now() + Math.floor(Math.random() * 1000); }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  function daysSince(dateStr) {
    if (!dateStr) return null;
    const then = new Date(dateStr).getTime();
    if (isNaN(then)) return null;
    return Math.floor((Date.now() - then) / (1000 * 60 * 60 * 24));
  }

  function lastCheckedBadge(item) {
    const days = daysSince(item.lastChecked);
    if (days === null) return `<span class="badge never">Never checked</span>`;
    if (days > OVERDUE_DAYS) return `<span class="badge overdue">${days}d overdue</span>`;
    return `<span class="badge ok">${days}d ago</span>`;
  }

  function latestReading(item) {
    if (!item.readings || item.readings.length === 0) return null;
    return [...item.readings].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
  }

  function render() {
    const q = state.search.trim().toLowerCase();
    const filtered = state.items.filter((it) =>
      !q || it.name.toLowerCase().includes(q) || (it.identifier || "").toLowerCase().includes(q) ||
      (it.location || "").toLowerCase().includes(q) || (it.team || "").toLowerCase().includes(q)
    );

    const overdueCount = state.items.filter((it) => {
      const days = daysSince(it.lastChecked);
      return days === null || days > OVERDUE_DAYS;
    }).length;

    const rows = filtered.map((item) => {
      const latest = latestReading(item);
      return `
        <tr>
          <td style="font-weight:500;">${escapeHtml(item.name)}</td>
          <td class="mono-cell">${escapeHtml(item.identifier || "—")}</td>
          <td>${escapeHtml(item.location || "—")}</td>
          <td>${escapeHtml(item.team || "—")}</td>
          <td>${lastCheckedBadge(item)}</td>
          <td class="mono-cell">
            ${latest ? `${latest.wattage || 0}W · ${latest.rpm || 0}rpm · ${latest.torque || 0}Nm` : "No readings yet"}
          </td>
          <td class="notes-cell">${escapeHtml(item.notes || "")}</td>
          <td>
            <div class="row-actions">
              <button class="icon-btn" data-log-reading="${item.id}" title="Log reading" style="display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--accent);">${svg.gauge} Log</button>
              <button class="icon-btn" data-view-chart="${item.id}" title="View chart" style="display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted);">${svg.chart} Chart</button>
              <button class="icon-btn" data-duplicate-item="${item.id}" title="Duplicate as new item">${svg.copy}</button>
              <button class="icon-btn" data-edit-item="${item.id}" title="Edit">${svg.pencil}</button>
              <button class="icon-btn danger" data-delete-item="${item.id}" title="Delete">${svg.trash}</button>
            </div>
          </td>
        </tr>`;
    }).join("");

    const emptyState = `
      <tr><td colspan="8">
        <div class="empty-state">
          ${state.items.length === 0
            ? `<div>No electronics logged yet. Add your first motor, controller, or brain.</div><button id="empty-add-btn">${svg.plus} Add Item</button>`
            : `<div>No items match your search.</div>`}
        </div>
      </td></tr>`;

    document.getElementById("app").innerHTML = `
      <div class="sidebar">
        <div class="brand">
          <div class="brand-row">${svg.chip} <span class="brand-title">ELECTRONICS</span></div>
          <div class="brand-sub">C2C ROBOTICS · TRACKER</div>
        </div>
        <div class="nav-list">
          <div class="nav-item active">${svg.chip} All Items <span style="margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11.5px; opacity:0.7;">${state.items.length}</span></div>
        </div>
        ${overdueCount > 0 ? `
          <div style="margin:12px; padding:10px 12px; background:var(--warn-bg); border-radius:6px; font-size:12.5px; color:#5A4322; line-height:1.4;">
            <strong>${overdueCount}</strong> item${overdueCount > 1 ? "s" : ""} overdue or never checked.
          </div>` : ""}
        <div class="footer-note" id="report-btn" style="cursor:pointer; display:flex; align-items:center; gap:7px;">${svg.chevron} Generate Report</div>
        <a href="index.html" class="footer-note" style="text-decoration:none; display:flex; align-items:center; gap:7px; color:var(--muted);">${svg.chevron} Stockroom</a>
        <div class="footer-note" id="save-status">Synced.</div>
        <div class="user-row">
          <span>${escapeHtml(auth.currentUser ? auth.currentUser.email : "")}</span>
          <span class="logout-link" id="logout-link">Sign out</span>
        </div>
      </div>
      <div class="main">
        <div class="topbar">
          <div class="topbar-left">
            <div class="search-wrap">
              ${svg.search}
              <input class="search-input" id="search-input" placeholder="Search by name, ID, location, team" value="${escapeHtml(state.search)}" style="padding-left:32px;" />
            </div>
            <div class="unit-total">${state.items.length} item${state.items.length === 1 ? "" : "s"} tracked</div>
          </div>
          <button class="btn-primary" id="add-item-btn">${svg.plus} Add Item</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Identifier</th><th>Location</th><th>Team</th><th>Last Checked</th><th>Latest Reading</th><th>Notes / Issues</th><th></th></tr></thead>
            <tbody>${filtered.length ? rows : emptyState}</tbody>
          </table>
        </div>
      </div>
    `;

    attachHandlers();
  }

  function attachHandlers() {
    const searchInput = document.getElementById("search-input");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        state.search = e.target.value;
        render();
        document.getElementById("search-input").focus();
        document.getElementById("search-input").setSelectionRange(state.search.length, state.search.length);
      });
    }

    const addBtn = document.getElementById("add-item-btn");
    if (addBtn) addBtn.addEventListener("click", () => openItemModal(null));
    const emptyAddBtn = document.getElementById("empty-add-btn");
    if (emptyAddBtn) emptyAddBtn.addEventListener("click", () => openItemModal(null));

    document.querySelectorAll("[data-edit-item]").forEach((el) => {
      el.addEventListener("click", () => openItemModal(state.items.find((it) => it.id === el.getAttribute("data-edit-item"))));
    });
    document.querySelectorAll("[data-duplicate-item]").forEach((el) => {
      el.addEventListener("click", () => openItemModal(null, state.items.find((it) => it.id === el.getAttribute("data-duplicate-item"))));
    });
    document.querySelectorAll("[data-delete-item]").forEach((el) => {
      el.addEventListener("click", () => {
        const id = el.getAttribute("data-delete-item");
        if (!confirm("Delete this item and its full reading history?")) return;
        state.items = state.items.filter((it) => it.id !== id);
        saveState();
        render();
      });
    });
    document.querySelectorAll("[data-log-reading]").forEach((el) => {
      el.addEventListener("click", () => openLogReadingModal(state.items.find((it) => it.id === el.getAttribute("data-log-reading"))));
    });
    document.querySelectorAll("[data-view-chart]").forEach((el) => {
      el.addEventListener("click", () => openChartModal(state.items.find((it) => it.id === el.getAttribute("data-view-chart"))));
    });

    const reportBtn = document.getElementById("report-btn");
    if (reportBtn) reportBtn.addEventListener("click", openReportModal);

    const logoutLink = document.getElementById("logout-link");
    if (logoutLink) logoutLink.addEventListener("click", () => auth.signOut());
  }

  function showModal(innerHtml, wide) {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.id = "modal-overlay";
    overlay.innerHTML = `<div class="modal${wide ? " wide" : ""}">${innerHtml}</div>`;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
    document.body.appendChild(overlay);
    document.getElementById("modal-close").addEventListener("click", closeModal);
  }

  function closeModal() {
    const overlay = document.getElementById("modal-overlay");
    if (overlay) overlay.remove();
  }

  function openItemModal(item, duplicateFrom) {
    const isNew = !item;
    let draft;
    if (item) {
      draft = { ...item };
    } else if (duplicateFrom) {
      draft = {
        ...duplicateFrom,
        id: null,
        identifier: "",
        lastChecked: "",
        readings: [],
      };
    } else {
      draft = {
        id: null, name: "", identifier: "", location: "", team: "",
        purchaseDate: "", lastChecked: "", notes: "", readings: [],
      };
    }

    showModal(`
      <div class="modal-header">
        <div class="modal-title">${duplicateFrom ? "Duplicate Item" : isNew ? "Add Item" : "Edit Item"}</div>
        <button class="modal-close" id="modal-close">${svg.x}</button>
      </div>
      ${duplicateFrom ? `<div style="font-size:12.5px; color:var(--muted); margin-bottom:14px;">Copying from <strong style="color:var(--ink);">${escapeHtml(duplicateFrom.name)}</strong> — give this one its own Identifier below.</div>` : ""}
      <div class="field"><label>Name</label><input id="f-name" value="${escapeHtml(draft.name)}" placeholder="e.g. Drive Motor — Left" /></div>
      <div class="field"><label>Identifier</label><input class="mono" id="f-identifier" value="${escapeHtml(draft.identifier)}" placeholder="Serial / asset tag" /></div>
      <div class="field-row">
        <div class="field"><label>Location</label><input id="f-location" value="${escapeHtml(draft.location)}" /></div>
        <div class="field"><label>Assigned team</label><input id="f-team" value="${escapeHtml(draft.team)}" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Original purchase date</label><input type="date" id="f-purchase" value="${escapeHtml(draft.purchaseDate)}" /></div>
        <div class="field"><label>Last date checked</label><input type="date" id="f-lastchecked" value="${escapeHtml(draft.lastChecked)}" /></div>
      </div>
      <div class="field"><label>Notes / Issues</label><textarea id="f-notes">${escapeHtml(draft.notes)}</textarea></div>
      <div id="item-save-error" style="color:var(--danger); font-size:12px; margin-bottom:8px; min-height:14px;"></div>
      <button class="modal-save" id="modal-save">${isNew ? "Add item" : "Save changes"}</button>
    `);

    document.getElementById("modal-save").addEventListener("click", () => {
      const name = document.getElementById("f-name").value.trim();
      const errorEl = document.getElementById("item-save-error");
      if (!name) {
        errorEl.textContent = "Item name is required.";
        return;
      }
      const purchaseDate = document.getElementById("f-purchase").value;
      const lastChecked = document.getElementById("f-lastchecked").value;
      if (purchaseDate && lastChecked && new Date(lastChecked) < new Date(purchaseDate)) {
        errorEl.textContent = "Last checked date can't be before the purchase date.";
        return;
      }
      const updated = {
        id: draft.id || uid("e"),
        name,
        identifier: document.getElementById("f-identifier").value.trim(),
        location: document.getElementById("f-location").value.trim(),
        team: document.getElementById("f-team").value.trim(),
        purchaseDate,
        lastChecked,
        notes: document.getElementById("f-notes").value.trim(),
        readings: draft.readings || [],
      };
      if (isNew) state.items.push(updated);
      else state.items = state.items.map((it) => (it.id === updated.id ? updated : it));
      saveState();
      closeModal();
      render();
    });
  }

  function openLogReadingModal(item) {
    const today = new Date().toISOString().slice(0, 10);
    showModal(`
      <div class="modal-header">
        <div class="modal-title">Log Reading</div>
        <button class="modal-close" id="modal-close">${svg.x}</button>
      </div>
      <div style="font-size:13.5px; font-weight:500; margin-bottom:2px;">${escapeHtml(item.name)}</div>
      <div style="font-size:12px; color:var(--muted); font-family:'IBM Plex Mono', monospace; margin-bottom:16px;">${escapeHtml(item.identifier || "")}</div>
      <div class="field"><label>Date</label><input type="date" id="r-date" value="${today}" /></div>
      <div class="field-row">
        <div class="field"><label>No load wattage (W)</label><input class="mono" type="number" step="any" id="r-wattage" /></div>
        <div class="field"><label>No load RPM</label><input class="mono" type="number" step="any" id="r-rpm" /></div>
        <div class="field"><label>No load torque (Nm)</label><input class="mono" type="number" step="any" id="r-torque" /></div>
      </div>
      <button class="modal-save" id="modal-save">Save reading</button>
      <div id="reading-save-error" style="color:var(--danger); font-size:12px; margin-top:8px; min-height:14px;"></div>
    `);

    document.getElementById("modal-save").addEventListener("click", () => {
      const date = document.getElementById("r-date").value || today;
      const errorEl = document.getElementById("reading-save-error");
      if (item.purchaseDate && new Date(date) < new Date(item.purchaseDate)) {
        errorEl.textContent = "Reading date can't be before the purchase date.";
        return;
      }
      const reading = {
        id: uid("r"),
        date,
        wattage: Number(document.getElementById("r-wattage").value) || 0,
        rpm: Number(document.getElementById("r-rpm").value) || 0,
        torque: Number(document.getElementById("r-torque").value) || 0,
      };
      const updatedItem = {
        ...item,
        readings: [...(item.readings || []), reading],
        lastChecked: date,
      };
      state.items = state.items.map((it) => (it.id === item.id ? updatedItem : it));
      saveState();
      closeModal();
      render();
    });
  }

  let activeChart = null;

  function openChartModal(item) {
    const readings = [...(item.readings || [])].sort((a, b) => new Date(a.date) - new Date(b.date));

    const historyRows = readings.length
      ? [...readings].reverse().map((r) => `
          <tr><td>${escapeHtml(r.date)}</td><td>${r.wattage}W</td><td>${r.rpm}rpm</td><td>${r.torque}Nm</td></tr>
        `).join("")
      : "";

    showModal(`
      <div class="modal-header">
        <div class="modal-title">${escapeHtml(item.name)}</div>
        <button class="modal-close" id="modal-close">${svg.x}</button>
      </div>
      <div class="chart-controls">
        <div class="field">
          <label>Metric</label>
          <select id="chart-metric">
            <option value="wattage">No load wattage (W)</option>
            <option value="rpm">No load RPM</option>
            <option value="torque">No load torque (Nm)</option>
          </select>
        </div>
        <div class="field">
          <label>Chart type</label>
          <select id="chart-type">
            <option value="line">Line</option>
            <option value="bar">Bar</option>
          </select>
        </div>
      </div>
      <div class="chart-canvas-wrap">
        <canvas id="reading-chart" height="180"></canvas>
      </div>
      <button class="btn-secondary" id="download-chart-btn" style="width:100%; margin-bottom:16px;">Download PNG</button>
      <div class="modal-title" style="font-size:15px; margin-bottom:8px;">Reading History</div>
      <table class="history-table">
        <thead><tr><th>Date</th><th>Wattage</th><th>RPM</th><th>Torque</th></tr></thead>
        <tbody>${historyRows || `<tr><td colspan="4" class="history-empty">No readings logged yet.</td></tr>`}</tbody>
      </table>
    `, true);

    function drawChart() {
      const metric = document.getElementById("chart-metric").value;
      const type = document.getElementById("chart-type").value;
      const labels = readings.map((r) => r.date);
      const data = readings.map((r) => r[metric]);
      const metricLabel = { wattage: "No load wattage (W)", rpm: "No load RPM", torque: "No load torque (Nm)" }[metric];

      if (activeChart) { activeChart.destroy(); activeChart = null; }
      const ctx = document.getElementById("reading-chart").getContext("2d");
      activeChart = new Chart(ctx, {
        type: type,
        data: {
          labels: labels,
          datasets: [{
            label: metricLabel,
            data: data,
            borderColor: "#2F5D74",
            backgroundColor: type === "bar" ? "#2F5D74" : "rgba(47,93,116,0.15)",
            fill: type === "line",
            tension: 0.25,
            pointRadius: 3,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false }, title: { display: true, text: `${escapeHtml(item.name)} — ${metricLabel}` } },
          scales: { y: { beginAtZero: true } },
        },
      });
    }

    if (readings.length === 0) {
      document.getElementById("reading-chart").outerHTML = `<div style="text-align:center; color:#9A988E; padding:30px; font-size:13px;">No readings yet — log one to start charting.</div>`;
    } else {
      drawChart();
      document.getElementById("chart-metric").addEventListener("change", drawChart);
      document.getElementById("chart-type").addEventListener("change", drawChart);
    }

    document.getElementById("download-chart-btn").addEventListener("click", () => {
      if (!activeChart) { alert("No chart to download yet — log at least one reading first."); return; }
      const link = document.createElement("a");
      link.download = `${item.name.replace(/[^a-z0-9]/gi, "_")}_${document.getElementById("chart-metric").value}.png`;
      link.href = document.getElementById("reading-chart").toDataURL("image/png");
      link.click();
    });

    const originalClose = document.getElementById("modal-close");
    originalClose.addEventListener("click", () => { if (activeChart) { activeChart.destroy(); activeChart = null; } });
  }

  function openReportModal() {
    renderReport("all", "all", true);
  }

  function buildReportContent(locationFilter, teamFilter) {
    const locations = [...new Set(state.items.map((it) => it.location).filter(Boolean))];
    const teams = [...new Set(state.items.map((it) => it.team).filter(Boolean))];

    const locationOptions = `<option value="all" ${locationFilter === "all" ? "selected" : ""}>All Locations</option>` +
      locations.map((l) => `<option value="${escapeHtml(l)}" ${locationFilter === l ? "selected" : ""}>${escapeHtml(l)}</option>`).join("");
    const teamOptions = `<option value="all" ${teamFilter === "all" ? "selected" : ""}>All Teams</option>` +
      teams.map((t) => `<option value="${escapeHtml(t)}" ${teamFilter === t ? "selected" : ""}>${escapeHtml(t)}</option>`).join("");

    const items = state.items.filter((it) =>
      (locationFilter === "all" || it.location === locationFilter) &&
      (teamFilter === "all" || it.team === teamFilter)
    );

    const flaggedCount = items.filter((it) => {
      const days = daysSince(it.lastChecked);
      return days === null || days > OVERDUE_DAYS;
    }).length;

    const rows = items.map((it) => {
      const days = daysSince(it.lastChecked);
      const flagged = days === null || days > OVERDUE_DAYS;
      const statusLabel = days === null ? "Never checked" : days > OVERDUE_DAYS ? `${days}d overdue` : "OK";
      return `
        <tr class="${flagged ? "report-row-flag" : ""}">
          <td>${escapeHtml(it.name)}</td>
          <td>${escapeHtml(it.identifier || "—")}</td>
          <td>${escapeHtml(it.location || "—")}</td>
          <td>${escapeHtml(it.team || "—")}</td>
          <td>${statusLabel}</td>
          <td>${escapeHtml(it.notes || "")}</td>
        </tr>`;
    }).join("");

    return { locationOptions, teamOptions, items, flaggedCount, rows };
  }

  function renderReport(locationFilter, teamFilter, isFirstOpen) {
    const { locationOptions, teamOptions, items, flaggedCount, rows } = buildReportContent(locationFilter, teamFilter);

    const content = `
      <div class="modal-header">
        <div class="modal-title">Electronics Report</div>
        <button class="modal-close" id="modal-close">${svg.x}</button>
      </div>
      <div class="report-controls">
        <div class="field"><label>Location</label><select id="report-location">${locationOptions}</select></div>
        <div class="field"><label>Team</label><select id="report-team">${teamOptions}</select></div>
      </div>
      <div style="font-size:12.5px; color:var(--muted); margin-bottom:14px; display:flex; justify-content:space-between;">
        <span>${items.length} item${items.length === 1 ? "" : "s"}</span>
        <span><strong style="color:var(--ink); font-family:'IBM Plex Mono',monospace;">${flaggedCount}</strong> overdue or never checked</span>
      </div>
      <div class="report-table-wrap">
        <table class="report-table">
          <thead><tr><th>Name</th><th>Identifier</th><th>Location</th><th>Team</th><th>Status</th><th>Notes / Issues</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" style="text-align:center; color:#9A988E; padding:24px;">No items match.</td></tr>`}</tbody>
        </table>
      </div>
      <button class="btn-secondary" id="print-report-btn" style="width:100%; margin-top:14px;">Print / Save as PDF</button>
    `;

    if (isFirstOpen) {
      showModal(content, true);
    } else {
      document.querySelector("#modal-overlay .modal").innerHTML = content;
      document.getElementById("modal-close").addEventListener("click", closeModal);
    }

    document.getElementById("report-location").addEventListener("change", (e) => {
      renderReport(e.target.value, document.getElementById("report-team").value, false);
    });
    document.getElementById("report-team").addEventListener("change", (e) => {
      renderReport(document.getElementById("report-location").value, e.target.value, false);
    });
    document.getElementById("print-report-btn").addEventListener("click", () => {
      const win = window.open("", "_blank", "width=750,height=850");
      win.document.write(`
        <html><head><title>Electronics Report</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 24px; color: #1E2320; }
          h1 { font-size: 18px; margin-bottom: 2px; }
          .sub { font-size: 12px; color: #6B6F68; margin-bottom: 18px; }
          table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
          th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #DCDAD3; }
          th { text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; color: #6B6F68; }
          .flag { background: #F6E4E2; color: #A93226; font-weight: 600; }
        </style>
        </head><body>
          <h1>Electronics Report</h1>
          <div class="sub">Generated ${new Date().toLocaleString()}</div>
          <table>
            <thead><tr><th>Name</th><th>Identifier</th><th>Location</th><th>Team</th><th>Status</th><th>Notes / Issues</th></tr></thead>
            <tbody>
              ${items.map((it) => {
                const days = daysSince(it.lastChecked);
                const flagged = days === null || days > OVERDUE_DAYS;
                const statusLabel = days === null ? "Never checked" : days > OVERDUE_DAYS ? `${days}d overdue` : "OK";
                return `<tr class="${flagged ? "flag" : ""}"><td>${escapeHtml(it.name)}</td><td>${escapeHtml(it.identifier || "—")}</td><td>${escapeHtml(it.location || "—")}</td><td>${escapeHtml(it.team || "—")}</td><td>${statusLabel}</td><td>${escapeHtml(it.notes || "")}</td></tr>`;
              }).join("")}
            </tbody>
          </table>
          <script>window.onload = () => { window.print(); }<\/script>
        </body></html>
      `);
      win.document.close();
    });
  }

  // ---- Auth ----
  let authMode = "signin";

  function showAuthScreen() {
    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("app").style.display = "none";
    document.getElementById("auth-screen").style.display = "flex";
    updateAuthScreenLabels();
  }

  function updateAuthScreenLabels() {
    document.getElementById("auth-submit").textContent = authMode === "signin" ? "Sign In" : "Create Account";
    document.getElementById("auth-toggle").innerHTML = authMode === "signin"
      ? `Don't have an account? <span id="auth-toggle-link">Create one</span>`
      : `Already have an account? <span id="auth-toggle-link">Sign in</span>`;
    document.getElementById("auth-toggle-link").addEventListener("click", () => {
      authMode = authMode === "signin" ? "signup" : "signin";
      document.getElementById("auth-error").textContent = "";
      updateAuthScreenLabels();
    });
  }

  function handleAuthSubmit() {
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    const errorEl = document.getElementById("auth-error");
    errorEl.textContent = "";
    if (!email || !password) { errorEl.textContent = "Enter an email and password."; return; }
    const action = authMode === "signin"
      ? auth.signInWithEmailAndPassword(email, password)
      : auth.createUserWithEmailAndPassword(email, password);
    action.catch((err) => { errorEl.textContent = err.message; });
  }

  document.getElementById("auth-submit").addEventListener("click", handleAuthSubmit);
  document.getElementById("auth-password").addEventListener("keydown", (e) => { if (e.key === "Enter") handleAuthSubmit(); });
  updateAuthScreenLabels();

  auth.onAuthStateChanged((user) => {
    if (user) {
      document.getElementById("auth-screen").style.display = "none";
      startSync();
    } else {
      if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
      showAuthScreen();
    }
  });
})();
</script>
</body>
</html>
